<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Danh sách nhóm</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #dfe6ec;
    display: flex;
    justify-content: center;
    padding: 24px 0;
  }
  .phone {
    width: 480px;
    max-width: 100%;
    min-height: 90vh;
    background: #eef2f6;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: #0068ff;
    color: #fff;
    padding: 16px 18px;
    flex-shrink: 0;
  }
  .header .title { font-weight: 700; font-size: 18px; }
  .header .sub { font-size: 12.5px; opacity: .85; margin-top: 2px; }

  .group-list { flex: 1; overflow-y: auto; background: #fff; }
  .group-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid #eef1f4;
    text-decoration: none;
    color: inherit;
  }
  .group-row:hover { background: #f7f9fc; }
  .group-avatar {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    background: #0068ff; color: #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 16px;
  }
  .group-main { flex: 1; min-width: 0; }
  .group-main .name { font-weight: 700; font-size: 14.5px; color: #1c2b36; }
  .group-main .preview {
    font-size: 12.5px; color: #6a778; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-meta { text-align: right; flex-shrink: 0; }
  .group-meta .time { font-size: 11px; color: #93a1ab; }
  .group-meta .count {
    display: inline-block; margin-top: 4px; font-size: 10.5px; color: #0068ff;
    background: #e9f1ff; border-radius: 10px; padding: 2px 8px; font-weight: 700;
  }
  .footer-link {
    flex-shrink: 0; text-align: center; padding: 12px; background: #fff;
    border-top: 1px solid #eef1f4;
  }
  .footer-link a { color: #0068ff; text-decoration: none; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="title">Nhóm chat</div>
      <div class="sub">{{ groups|length }} nhóm — mỗi nhóm một phong cách trao đổi/báo cáo riêng</div>
    </div>
    <div class="group-list">
      {% for g in groups %}
      <a class="group-row" href="{{ url_for('group_chat', slug=g.slug) }}">
        <div class="group-avatar">{{ g.name[:1] }}</div>
        <div class="group-main">
          <div class="name">{{ g.name }}</div>
          <div class="preview">{{ g.last_preview }}</div>
        </div>
        <div class="group-meta">
          <div class="time">{{ g.last_time_label or '' }}</div>
          <div class="count">{{ g.count }} tin · {{ g.member_count }} thành viên</div>
        </div>
      </a>
      {% endfor %}
    </div>
    <div class="footer-link">
      <a href="/stats">📊 Xem thống kê thu chi</a>
    </div>
  </div>
</body>
</html>
